<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Portal - KidSync</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        display: flex;
        max-width: 1100px;
        width: 90%;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      .left {
        flex: 1;
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        color: white;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }
      .left h1 {
        font-size: 2.2rem;
        margin-bottom: 1rem;
      }
      .left p {
        font-size: 1rem;
        opacity: 0.9;
      }
      .right {
        flex: 1;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .right h2 {
        color: #10b981;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: #666;
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.2rem;
      }
      .form-group label {
        display: block;
        color: #333;
        font-weight: 500;
        margin-bottom: 0.4rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.8rem;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 1rem;
      }
      .form-group input:focus {
        outline: none;
        border-color: #10b981;
      }
      .btn {
        width: 100%;
        padding: 0.9rem;
        background: #10b981;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      .btn:hover {
        background: #059669;
      }
      .links {
        text-align: center;
        margin-top: 1.5rem;
      }
      .links a {
        color: #10b981;
        text-decoration: none;
        font-weight: 600;
      }
      @media (max-width: 768px) {
        .container {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="left">
        <h1>👨‍🏫 Teacher Portal</h1>
        <p>Manage students, grades, and communicate with parents</p>
      </div>
      <div class="right">
        <h2>Login</h2>
        <p class="subtitle">Access your teacher dashboard</p>
        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" value="teacher@demo.com" required />
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" value="teacher123" required />
          </div>
          <button type="submit" class="btn">Login</button>
        </form>
        <div class="links">Demo: teacher@demo.com / teacher123</div>
      </div>
    </div>

    <script>
      const API_BASE = "../backend/api";

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch(API_BASE + "/login.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            if (data.success && data.user.role === "teacher") {
              localStorage.setItem("teacher", JSON.stringify(data.user));
              window.location.href = "dashboard.html";
            } else {
              alert(data.message || "Login failed");
            }
          } catch (error) {
            alert("Error: " + error.message);
          }
        });
    </script>
  </body>
</html>
