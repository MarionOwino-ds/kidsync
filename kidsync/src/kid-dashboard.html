<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid Dashboard - KidSync</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
        .container { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%); color: white; padding: 1.5rem 1rem; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar h3 { margin-bottom: 2rem; }
        .sidebar a { display: block; padding: 0.8rem 1rem; color: white; text-decoration: none; border-radius: 6px; margin-bottom: 0.3rem; }
        .sidebar a:hover { background: rgba(255,255,255,0.15); }
        .main { margin-left: 220px; flex: 1; padding: 0; }
        .navbar { background: white; padding: 1.2rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .navbar img { width: 100px; }
        .content { padding: 2rem; }
        .header { background: white; padding: 1.5rem; border-radius: 10px; margin-bottom: 2rem; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #1e40af; font-size: 1.6rem; }
        .back-btn { background: #2563eb; color: white; border: none; padding: 0.7rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .back-btn:hover { background: #1e40af; }
        .kid-card { background: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .kid-avatar { width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ea580c); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; }
        .kid-name { font-size: 1.8rem; color: #1e40af; font-weight: 600; }
        .kid-info { color: #666; margin-top: 0.5rem; }
        .status-badge { display: inline-block; padding: 0.6rem 1.2rem; border-radius: 20px; font-weight: 600; margin-top: 1rem; }
        .status-at-school { background: #d1fae5; color: #065f46; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        .stat-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
        .stat-title { color: #1e40af; font-weight: 600; margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.8rem; color: #f97316; font-weight: bold; }
        .activity-section { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .activity-section h3 { color: #1e40af; margin-bottom: 1rem; }
        .activity-item { padding: 0.8rem; border-bottom: 1px solid #e5e7eb; }
        .activity-item:last-child { border-bottom: none; }
        .activity-time { color: #f97316; font-weight: 600; }
        .activity-desc { color: #666; margin-top: 0.3rem; }
        .logout { width: 100%; padding: 0.7rem; margin-top: auto; border: none; background: rgba(255,255,255,0.1); color: white; border-radius: 6px; cursor: pointer; }
        @media (max-width: 768px) { .sidebar { width: 100%; position: relative; height: auto; } .main { margin-left: 0; } .header { flex-direction: column; gap: 1rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menu</h3>
            <a href="dashboard.html">📊 Dashboard</a>
            <a href="activities.html">📖 Activities</a>
            <a href="health.html">🍎 Health</a>
            <a href="milestones.html">⭐ Milestones</a>
            <a href="calender.html">📅 Calendar</a>
            <a href="location.html">📍 Location</a>
            <a href="profile.html">👤 Profile</a>
            <a href="settings.html">⚙️ Settings</a>
            <button class="logout" onclick="logout()">🚪 Logout</button>
        </div>

        <div class="main">
            <div class="navbar">
                <img src="Screenshot from 2025-10-27 08-11-57.png" alt="KidSync">
            </div>

            <div class="content">
                <div class="header">
                    <h1 id="pageTitle">Kid Dashboard</h1>
                    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back</button>
                </div>

                <div class="kid-card" id="kidCard"></div>

                <h2 style="color: #1e40af; font-size: 1.3rem; margin-bottom: 1rem;">📊 Today's Stats</h2>
                <div class="grid" id="statsGrid"></div>

                <div class="activity-section">
                    <h3>📋 Today's Activities</h3>
                    <div id="activityList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const kids = [
            { id: 1, name: "Daudi Okelo", age: 5, grade: "Grade 1", emoji: "🧒", status: "at-school", meals: "2 of 3", messages: 3, sleep: "9.5 hrs", mood: "Happy", activity: [{time: "8:15 AM", e: "Boarded Bus"}, {time: "8:45 AM", e: "Arrived at School"}, {time: "9:00 AM", e: "🍽️ Breakfast"}, {time: "10:30 AM", e: "🎨 Art Activity"}, {time: "12:30 PM", e: "🍽️ Lunch"}] },
            { id: 2, name: "Zainab Ahmed", age: 4, grade: "Pre-K", emoji: "👧", status: "at-school", meals: "2 of 3", messages: 1, sleep: "8.5 hrs", mood: "Energetic", activity: [{time: "8:00 AM", e: "Boarded Bus"}, {time: "8:30 AM", e: "Arrived at School"}, {time: "9:15 AM", e: "🎵 Music Class"}] },
            { id: 3, name: "Liam Johnson", age: 6, grade: "Grade 2", emoji: "👦", status: "at-school", meals: "2 of 3", messages: 5, sleep: "9 hrs", mood: "Playful", activity: [{time: "8:10 AM", e: "Boarded Bus"}, {time: "8:40 AM", e: "Arrived at School"}, {time: "9:30 AM", e: "⚽ Sports Time"}] }
        ];

        window.addEventListener("load", () => {
            const kidId = localStorage.getItem('selectedKidId') || 1;
            const kid = kids.find(k => k.id == kidId);
            if (kid) displayKidDashboard(kid);
        });

        function displayKidDashboard(kid) {
            document.getElementById("pageTitle").textContent = `${kid.name}'s Dashboard`;
            
            document.getElementById("kidCard").innerHTML = `
                <div class="kid-avatar">${kid.emoji}</div>
                <div class="kid-name">${kid.name}</div>
                <div class="kid-info">${kid.age} years old • ${kid.grade}</div>
                <div class="status-badge status-${kid.status}">${kid.status === 'at-school' ? 'At School' : 'On Bus'}</div>
            `;

            document.getElementById("statsGrid").innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">🍽️</div>
                    <div class="stat-title">Meals Today</div>
                    <div class="stat-value">${kid.meals}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💬</div>
                    <div class="stat-title">Messages</div>
                    <div class="stat-value">${kid.messages}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">😴</div>
                    <div class="stat-title">Sleep</div>
                    <div class="stat-value">${kid.sleep}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">😊</div>
                    <div class="stat-title">Mood</div>
                    <div class="stat-value">${kid.mood}</div>
                </div>
            `;

            document.getElementById("activityList").innerHTML = kid.activity.map(a => `
                <div class="activity-item">
                    <div class="activity-time">${a.time}</div>
                    <div class="activity-desc">${a.e}</div>
                </div>
            `).join("");
        }

        function logout() {
            if (confirm("Logout?")) {
                localStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
