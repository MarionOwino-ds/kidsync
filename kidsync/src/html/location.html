<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location - KidSync</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f8fafc;
      }
      .container {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 220px;
        background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
        color: white;
        padding: 1.5rem 1rem;
        position: fixed;
        height: 100vh;
        overflow-y: auto;
      }
      .sidebar h3 {
        margin-bottom: 2rem;
      }
      .sidebar a {
        display: block;
        padding: 0.8rem 1rem;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        margin-bottom: 0.3rem;
        transition: 0.3s;
      }
      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .main {
        margin-left: 220px;
        flex: 1;
        padding: 0;
      }
      .navbar {
        background: white;
        padding: 1.2rem;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .navbar img {
        width: 100px;
      }
      .content {
        padding: 2rem;
      }
      .header {
        background: white;
        padding: 1.5rem;
        border-radius: 10px;
        margin-bottom: 2rem;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      }
      .header h1 {
        color: #1e40af;
        font-size: 1.6rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .map {
        width: 100%;
        height: 400px;
        background: linear-gradient(135deg, #dbeafe, #fed7aa);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      .loc-data {
        background: #f0f9ff;
        padding: 1rem;
        border-radius: 8px;
        border-left: 4px solid #2563eb;
      }
      .loc-row {
        display: flex;
        justify-content: space-between;
        padding: 0.8rem 0;
        border-bottom: 1px solid #e5e7eb;
      }
      .loc-row:last-child {
        border-bottom: none;
      }
      .loc-label {
        color: #1e40af;
        font-weight: 600;
      }
      .loc-value {
        color: #666;
      }
      .status-badge {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        border-radius: 20px;
        font-weight: 600;
        margin-bottom: 1rem;
      }
      .status-at-school {
        background: #d1fae5;
        color: #065f46;
      }
      .status-on-bus {
        background: #fef3c7;
        color: #92400e;
      }
      .status-home {
        background: #dbeafe;
        color: #1e40af;
      }
      .refresh-btn {
        background: #f97316;
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
      }
      .refresh-btn:hover {
        background: #ea580c;
      }
      .history {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        margin-top: 2rem;
      }
      .history-item {
        padding: 0.8rem;
        border-bottom: 1px solid #e5e7eb;
        font-size: 0.9rem;
      }
      .history-item:last-child {
        border-bottom: none;
      }
      .history-time {
        color: #f97316;
        font-weight: 600;
      }
      .history-info {
        color: #666;
      }
      .logout {
        width: 100%;
        padding: 0.7rem;
        margin-top: auto;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-radius: 6px;
        cursor: pointer;
      }
      @media (max-width: 768px) {
        .sidebar {
          width: 100%;
          position: relative;
          height: auto;
        }
        .main {
          margin-left: 0;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .map {
          height: 250px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h3>Menu</h3>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="activities.html">📖 Activities</a>
        <a href="health.html">🍎 Health</a>
        <a href="milestones.html">⭐ Milestones</a>
        <a href="calender.html">📅 Calendar</a>
        <a href="location.html" style="background: rgba(255, 255, 255, 0.15)"
          >📍 Location</a
        >
        <a href="profile.html">👤 Profile</a>
        <a href="settings.html">⚙️ Settings</a>
        <button class="logout" onclick="logout()">🚪 Logout</button>
      </div>

      <div class="main">
        <div class="navbar">
          <img src="Screenshot from 2025-10-27 08-11-57.png" alt="KidSync" />
        </div>

        <div class="content">
          <div class="header">
            <h1>📍 Live Location Tracking</h1>
            <p id="kidName" style="color: #666; margin-top: 0.5rem">
              Loading...
            </p>
          </div>

          <div class="grid">
            <div class="card">
              <h3>🗺️ Live Map</h3>
              <div class="map">📍</div>
              <p style="color: #666; text-align: center; font-size: 0.9rem">
                Map integration ready for Google Maps / Mapbox APIs
              </p>
            </div>

            <div class="card">
              <h3>📍 GPS Location Data</h3>
              <div class="status-badge" id="statusBadge">Loading...</div>
              <div class="loc-data" id="locData"></div>
              <button
                class="refresh-btn"
                onclick="refreshLocation()"
                style="width: 100%; margin-top: 1rem"
              >
                🔄 Refresh Location
              </button>
            </div>
          </div>

          <div class="history">
            <h3 style="color: #1e40af; margin-bottom: 1rem">
              📊 Location History
            </h3>
            <div id="historyList"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/location.js"></script>
  </body>
</html>
